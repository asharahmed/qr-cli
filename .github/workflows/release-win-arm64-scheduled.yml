name: Build Windows ARM64 Binary (Scheduled)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.1.5)
        required: true

permissions:
  contents: write
  actions: write

jobs:
  resolve-tag:
    name: Resolve latest release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Fetch latest release tag
        id: tag
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/asharahmed/qr-cli/releases/latest | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No release tag found." >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  fallback-win-arm64:
    name: Fallback Windows ARM64 build
    runs-on: ubuntu-latest
    needs: resolve-tag
    if: ${{ needs.resolve-tag.outputs.tag != '' }}
    steps:
      - name: Check for existing Windows ARM64 asset
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve-tag.outputs.tag }}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          if echo "$assets" | grep -qx "qr-win-arm64.exe"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger self-hosted fallback
        if: ${{ steps.check.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve-tag.outputs.tag }}"
          gh workflow run .github/workflows/release-win-arm64.yml -f tag="$tag"
