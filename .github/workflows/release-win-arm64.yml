name: Build Windows ARM64 Binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.1.5)
        required: true

permissions:
  contents: write

jobs:
  build-win-arm64:
    name: Build qr-win-arm64.exe
    runs-on: [self-hosted, windows, arm64]
    env:
      NPM_CONFIG_CACHE: C:\actions-runner\_npm-cache
      PKG_CACHE_PATH: C:\actions-runner\_pkg-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure caches
        run: |
          New-Item -ItemType Directory -Force -Path $env:NPM_CONFIG_CACHE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PKG_CACHE_PATH | Out-Null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Build binary
        run: npx pkg dist/index.js --targets node18-win-arm64 --output release/${{ inputs.tag }}/qr-win-arm64.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/${{ inputs.tag }}/qr-win-arm64.exe
