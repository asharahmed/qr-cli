name: Build Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.1.4)
        required: true
        default: v1.1.4

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            asset: qr-linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            asset: qr-linux-arm64
          - os: windows-latest
            target: node18-win-x64
            asset: qr-win-x64.exe
          - os: macos-latest
            target: node18-macos-x64
            asset: qr-macos-x64
            macos_dual: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Build binary
        if: ${{ !matrix.macos_dual }}
        run: npx pkg dist/index.js --targets ${{ matrix.target }} --output release/${{ inputs.tag || github.ref_name }}/${{ matrix.asset }}

      - name: Build macOS binaries
        if: matrix.macos_dual
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release/${{ inputs.tag || github.ref_name }}"
          mkdir -p "$release_dir"
          npx pkg dist/index.js --targets node18-macos-x64 --output "$release_dir/qr-macos-x64"
          npx pkg dist/index.js --targets node18-macos-arm64 --output "$release_dir/qr-macos-arm64"
          lipo -create -output "$release_dir/qr-macos-universal" "$release_dir/qr-macos-x64" "$release_dir/qr-macos-arm64"

      - name: Upload macOS assets
        if: matrix.macos_dual
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/${{ inputs.tag || github.ref_name }}/qr-macos-x64
            release/${{ inputs.tag || github.ref_name }}/qr-macos-arm64
            release/${{ inputs.tag || github.ref_name }}/qr-macos-universal

      - name: Upload release asset
        if: ${{ !matrix.macos_dual }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/${{ inputs.tag || github.ref_name }}/${{ matrix.asset }}

  upload-universal-installers:
    name: Upload universal installers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Linux installer is executable
        run: chmod +x scripts/universal/qr-linux-universal.sh

      - name: Upload universal installer assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            scripts/universal/qr-linux-universal.sh
            scripts/universal/qr-windows-universal.ps1
