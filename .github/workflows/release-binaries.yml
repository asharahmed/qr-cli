name: Build Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.1.4)
        required: true
        default: v1.1.4

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            asset: qr-linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            asset: qr-linux-arm64
          - os: windows-latest
            target: node18-win-x64
            asset: qr-win-x64.exe
          - os: windows-latest
            target: node18-win-arm64
            asset: qr-win-arm64.exe
          - os: macos-latest
            target: node18-macos-x64
            asset: qr-macos-x64
            macos_universal: true
          - os: macos-latest
            target: node18-macos-arm64
            asset: qr-macos-arm64
            macos_universal: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Build binary
        run: npx pkg dist/index.js --targets ${{ matrix.target }} --output release/${{ inputs.tag || github.ref_name }}/${{ matrix.asset }}

      - name: Build macOS universal binary
        if: matrix.macos_universal
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release/${{ inputs.tag || github.ref_name }}"
          mkdir -p "$release_dir"
          npx pkg dist/index.js --targets node18-macos-x64,node18-macos-arm64 --output "$release_dir/qr-macos-universal"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/${{ inputs.tag || github.ref_name }}/${{ matrix.asset }}
